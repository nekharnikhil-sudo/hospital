<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment Booking</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>City Care Super Specialty Hospital</h1>
        <p>Fast, Secure & Easy Online Doctor Appointment Booking</p>
    </header>

    <div class="container">
        <h2>Book an Appointment</h2>
        <form id="appointmentForm">
            <div class="form-group">
                <label for="fullName">Patient Full Name:</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter 10-digit mobile number">
            </div>

            <div class="form-group">
                <label for="email">Email Address (Optional):</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com">
            </div>

            <div class="form-group">
                <label for="doctor">Select Doctor:</label>
                <select id="doctor" name="doctor" required>
                    <option value="">-- Select Doctor --</option>
                    <option value="Dr. R. K. Sharma (General Physician)">Dr. R. K. Sharma (General Physician)</option>
                    <option value="Dr. Priya Verma (Gynecologist)">Dr. Priya Verma (Gynecologist)</option>
                    <option value="Dr. Amit Singh (Cardiologist)">Dr. Amit Singh (Cardiologist)</option>
                    <option value="Dr. Neha Gupta (Pediatrician)">Dr. Neha Gupta (Pediatrician)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Appointment Date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="message">Medical Reason / Symptoms:</label>
                <textarea id="message" name="message" rows="4" placeholder="Describe your symptoms or reason for visit..."></textarea>
            </div>

            <button type="submit">Book Appointment</button>
        </form>

        <div id="successMsg" class="success-message">
            Thank you! Your appointment has been booked successfully. Our team will contact you shortly.
        </div>
    </div>

    <footer>
        <p>&copy; 2026 City Care Hospital. All Rights Reserved.</p>
    </footer>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
